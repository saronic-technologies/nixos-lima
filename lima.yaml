# See https://github.com/lima-vm/lima/blob/master/templates/default.yaml for all lima options

# To use a locally built image instead, replace the images section above with:
# images:
#   - location: "./result/nixos.qcow2"
#     arch: aarch64
images:
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.3.0/nixos-determinate-v1.3.0-aarch64.qcow2
    arch: aarch64
    digest: sha512:bf2e926495f306bb607a6e8609b3286d438b2522caa3bd982d734a4e0681522b538fbd70ad89181020d347bb90a73ee91be0b1178c048e6485d6b0c8b3928e70
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.3.0/nixos-determinate-v1.3.0-x86_64.qcow2
    arch: x86_64
    digest: sha512:0f7e38bad93394828c9aff502c55f0190714ded3166e1af5cac662773facb3aba91f08672bf7a41fd2bffbf27c54d78039e537c761e3ffe98b18e2f7ed16c73a

mounts:
  - location: '~'
    writable: true

rosetta:
  enabled: true

cpus: 12
memory: 40GiB
disk: 1024GiB

portForwards:
  # NixOS intercepts UDP port 68 (DHCP), which causes Lima's port-forwarding to
  # capture host DHCP packets. Ignore it explicitly to prevent network issues.
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
  # rootless
  - guestSocket: "/run/user/{{.UID}}/podman/podman.sock"
    hostSocket: "{{.Dir}}/sock/podman.sock"
  # rootful
  - guestSocket: "/run/podman/podman.sock"
    hostSocket: "{{.Dir}}/sock/podman-rootful.sock"

containerd:
  system: false
  user: false

