# See https://github.com/lima-vm/lima/blob/master/templates/default.yaml for all lima options

# To use a locally built image instead, replace the images section below with:
# images:
#   - location: "./result/nixos.qcow2"
#     arch: aarch64
images:
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.2.2/nixos-determinate-v1.2.2-aarch64.qcow2
    arch: aarch64
    digest: sha512:784d556baebde7a139f94d0cbaff3f2f0110a3793da245b7fe9df475abdcc1f1f03948e7779fb740c19b15f068bf9ff02e70e78bbd574d08b735e0447738bf98
  - location: https://github.com/saronic-technologies/nixos-lima/releases/download/v1.2.2/nixos-determinate-v1.2.2-x86_64.qcow2
    arch: x86_64
    digest: sha512:d4e8ad3e4793eeef6aff8a611344c8b1f52b19d8619ac8fa602d8cc1f606c6ff4fb628adcb51b63a4c077fe29a0ddaf383a1edbd69e718a204536e29b990623b

mounts:
  - location: '~'
    writable: true

vmOpts:
  vz:
    rosetta:
      enabled: true

cpus: 12
memory: 40GiB
disk: 1024GiB

portForwards:
  # NixOS intercepts UDP port 68 (DHCP), which causes Lima's port-forwarding to
  # capture host DHCP packets. Ignore it explicitly to prevent network issues.
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

containerd:
  system: false
  user: false

# user:
#   name: "developer"

# ssh:
#   localPort: 60022
